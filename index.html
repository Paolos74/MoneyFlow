<!doctype html>
<!-- Shell di MoneyFlow: barra in alto, vista, barra delle schede, banner aggiornamento, CSP. -->
<html lang="it" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="MoneyFlow: spese, entrate, conti e risparmi personali.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MoneyFlow">
  <title>MoneyFlow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/moneyflow-v3-favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/moneyflow-v3-apple-touch-180.png">
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="topbar__side topbar__left" id="topbar-left"></div>
    <div class="topbar__title" id="topbar-title"></div>
    <div class="topbar__side topbar__right" id="topbar-right"></div>
  </header>
  <div id="offline-pill" class="offline-pill" role="status" hidden>Offline</div>
  <main id="view" class="view" tabindex="-1">
    <noscript><p class="noscript">MoneyFlow ha bisogno di JavaScript.</p></noscript>
  </main>
  <button id="fab" class="fab" type="button" aria-label="Nuovo movimento"></button>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button id="update-btn" type="button" class="update-banner__btn">Aggiorna</button>
  </div>
  <nav class="tabbar" aria-label="Schede">
    <a class="tab" href="#home" data-tab="home"><span class="tab__icon" data-icon="home"></span><span class="tab__label">Home</span></a>
    <a class="tab" href="#movimenti" data-tab="movimenti"><span class="tab__icon" data-icon="list"></span><span class="tab__label">Movimenti</span></a>
    <a class="tab" href="#calendario" data-tab="calendario"><span class="tab__icon" data-icon="calendar"></span><span class="tab__label">Calendario</span></a>
    <a class="tab" href="#statistiche" data-tab="statistiche"><span class="tab__icon" data-icon="chart"></span><span class="tab__label">Statistiche</span></a>
    <a class="tab" href="#conti" data-tab="conti"><span class="tab__icon" data-icon="wallet"></span><span class="tab__label">Conti</span></a>
  </nav>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="sheet-root"></div>
</body>
</html>
