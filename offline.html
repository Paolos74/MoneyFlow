<!doctype html>
<!-- Pagina offline autonoma: mostrata quando manca la rete e la pagina non è in cache. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <title>MoneyFlow · Offline</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/moneyflow-v3-favicon-32.png">
  <style>
    :root { color-scheme: light dark; --bg: #F2F2F7; --surface: #FFFFFF; --text: #111114; --muted: #5F5F67; --accent: #047857; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000000; --surface: #1C1C1E; --text: #F2F2F7; --muted: #ACACB3; --accent: #34D399; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { background: var(--surface); border-radius: 20px; padding: 28px 24px; max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.45; margin: 0 0 20px; }
    a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 22px; border-radius: 22px; background: #047857; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/moneyflow-v3-192.png" alt="">
    <h1>Sei offline</h1>
    <p>Questa pagina non è disponibile senza connessione. I tuoi dati sono al sicuro sul telefono.</p>
    <a href="./">Apri MoneyFlow</a>
  </div>
</body>
</html>
